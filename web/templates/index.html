<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamErase Demo</title><link rel="stylesheet" href="static/style.css"></head>
<body><main><header><div><p class="eyebrow">STREAM ERASE · REAL-TIME VIDEO INPAINTING</p><h1>擦除视频，速度超过实时播放</h1><p class="sub">选择原视频和对应 mask，模型会自动恢复被擦除区域。</p></div><div class="badge">CAUSAL · 1-STEP</div></header>
<section class="controls"><label>示例视频<select id="video">{% for p in presets %}<option value="{{p}}">{{p}}</option>{% endfor %}</select></label><button id="start">开始生成</button><span id="status">准备就绪</span></section>
<section class="metrics"><div><b id="elapsed">—</b><small>生成耗时</small></div><div><b id="fps">—</b><small>生成 FPS</small></div><div><b id="speed">—</b><small>实时倍率</small></div><div><b id="frames">—</b><small>输出帧数</small></div></section>
<section class="grid"><article><h2>原视频</h2><video id="src" controls loop muted></video></article><article><h2>Mask 预览</h2><video id="mask" controls loop muted></video></article><article class="result"><h2>擦除结果 <span id="progress">0%</span></h2><video id="out" controls loop></video><div class="bar"><i id="bar"></i></div></article></section>
<section class="timeline"><span>播放时间线</span><div><i id="playline"></i><em id="genline"></em></div><small>蓝色：播放进度　绿色：已生成进度</small></section></main><script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script><script src="static/app.js"></script></body></html>
